[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "idna-rust"
version = "3.20.1"
description = "Internationalized Domain Names in Applications (IDNA) — Rust-accelerated, API-compatible with idna 3.20"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/John-Cusack/idna-rust"
Upstream = "https://github.com/kjd/idna"

[tool.maturin]
bindings = "pyo3"
module-name = "idna._rust"
features = ["pyo3/extension-module"]
